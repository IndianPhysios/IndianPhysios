{% extends "base.html" %}
{% block title %}Reset Password · Indian Physios{% endblock %}

{% block content %}
<div class="formbox narrow">
    <h1>Reset your password</h1>

    <p class="muted">
        Choose a new password for your Indian Physios account.
    </p>

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label>
            New Password
            <input
                type="password"
                name="password"
                required
                minlength="8"
                autocomplete="new-password"
            >
        </label>

        <label>
            Confirm New Password
            <input
                type="password"
                name="confirm_password"
                required
                minlength="8"
                autocomplete="new-password"
            >
        </label>

        <button class="btn" type="submit">Reset Password</button>
    </form>

    <p class="muted">
        <a href="{{ url_for('login') }}">Back to Login</a>
    </p>
</div>
{% endblock %}
